<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Event Location | CampHus</title>
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }
        body { background: #f4f7fe; }
        #map { height: 100vh; width: 100%; }
        
        .back-btn {
            position: fixed;
            top: 20px;
            left: 20px;
            z-index: 1000;
            background: white;
            padding: 10px 25px;
            border-radius: 30px;
            text-decoration: none;
            color: #1b254b;
            font-weight: 600;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            display: flex;
            align-items: center;
        }
    </style>
</head>
<body>

    <a href="javascript:history.back()" class="back-btn"> ← Back to Event</a>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
    const params = new URLSearchParams(window.location.search);
    const lat = parseFloat(params.get('lat'));
    const lng = parseFloat(params.get('lng'));
    const title = decodeURIComponent(params.get('title') || "Event Location");
    const loc = decodeURIComponent(params.get('loc') || "");

    // Logic: Fallback to default coordinates if URL data is missing
    const finalLat = isNaN(lat) ? 13.0827 : lat;
    const finalLng = isNaN(lng) ? 80.2707 : lng;

    const map = L.map('map').setView([finalLat, finalLng], 16);

    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        attribution: '© OpenStreetMap'
    }).addTo(map);

    // FIXED: Google Maps Link 
    const googleMapsUrl = `https://www.google.com/maps?q=${finalLat},${finalLng}`;

    const marker = L.marker([finalLat, finalLng]).addTo(map);
    marker.bindPopup(`
        <div style="font-family: 'Poppins', sans-serif; padding: 5px;">
            <b style="font-size: 14px;">${title}</b><br>
            <p style="margin: 5px 0; color: #666; font-size: 12px;">${loc}</p>
            <a href="${googleMapsUrl}" target="_blank" 
               style="display: inline-block; margin-top: 8px; color: white; background: #9333ea; 
                      padding: 5px 12px; border-radius: 20px; text-decoration: none; font-size: 11px;">
               Open Google Maps
            </a>
        </div>
    `).openPopup();

    // Recalculate map size to prevent gray boxes
    setTimeout(() => { map.invalidateSize(); }, 300);
</script>
</body>
</html>
