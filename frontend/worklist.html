<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CampHus | Work List</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <script>
    (function() {
        const theme = localStorage.getItem('theme');
        if (theme === 'dark') {
            document.documentElement.classList.add('dark-theme');
        }
    })();
</script>
    <style>
        :root {
            --bg-body: #F4F7FE;
            --text-main: #1B254B;
            --primary: #9333ea;
            --primary-light: #f3e8ff;
            --card-bg: #ffffff;
            --border: #E2E8F0;
            --text-dim: #A3AED0;
        }

        /* Home Page Dark Mode Variables */
        .dark-theme {
    --bg-body: #0f172a;
    --sidebar-bg: #111c44;
    --text-main: #ffffff;
    --card-bg: rgba(255, 255, 255, 0.1);
    --border: rgba(255, 255, 255, 0.1);
    --primary-light: rgba(147, 51, 234, 0.2);
    --pure-black: #ffffff;
}
        body { 
            font-family: 'Poppins', sans-serif; 
            background: var(--bg-body); 
            color: var(--text-main); 
            padding: 40px; 
            margin: 0; 
            transition: 0.3s ease; 
        }
        
        .container { max-width: 1000px; margin: 0 auto; }
        
        .header-area { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; }
        
        .btn-back { 
            text-decoration: none; 
            color: var(--primary); 
            font-weight: 600; 
            display: flex; 
            align-items: center; 
            gap: 8px; 
            transition: 0.3s;
        }
        .btn-back:hover { transform: translateX(-5px); }

        .worklist-card { 
            background: var(--card-bg); 
            border-radius: 25px; /* Rounded like home cards */
            padding: 25px; 
            border: 1px solid var(--border); 
            box-shadow: 0 10px 30px rgba(0,0,0,0.05); 
            backdrop-filter: blur(10px);
        }
        
        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        
        th { 
            text-align: left; 
            padding: 15px; 
            border-bottom: 2px solid var(--border); 
            color: var(--text-main); /* Adaptive color */
            font-size: 13px; 
            text-transform: uppercase; 
            font-weight: 700; 
            opacity: 0.8;
        }
        
        td { padding: 15px; border-bottom: 1px solid var(--border); font-size: 14px; color: var(--text-main); }

        .status-badge { padding: 6px 15px; border-radius: 25px; font-size: 12px; font-weight: 600; }
        .status-live { background: #eefdf3; color: #22c55e; }
        /* Dark mode badge adjustment */
        body.dark-theme .status-live { background: rgba(34, 197, 94, 0.2); }

        .reg-count { font-weight: 700; color: var(--primary); }

        .action-icons { display: flex; gap: 15px; cursor: pointer; color: var(--text-main); }
        .action-icons i { transition: 0.3s; opacity: 0.7; }
        .action-icons i:hover { color: var(--primary); transform: scale(1.1); opacity: 1; }

    </style>

    <script>
        const savedTheme = localStorage.getItem('theme');
        if (savedTheme === 'dark') {
            document.documentElement.classList.add('dark-theme');
            const observer = new MutationObserver(() => {
                if (document.body) {
                    document.body.classList.add('dark-theme');
                    observer.disconnect();
                }
            });
            observer.observe(document.documentElement, { childList: true });
        }
    </script>
</head>
<body>

    <div class="container">
        <div class="header-area">
            <div>
                <a href="home.html" class="btn-back"><i data-lucide="arrow-left" size="18"></i> Back to Dashboard</a>
                <h1 style="margin-top: 15px;">Event Work List</h1>
                <p style="color: var(--text-dim); font-size: 14px;">Manage and track your event registrations.</p>
            </div>
        </div>

        <div class="worklist-card">
            <table>
                <thead>
                    <tr>
                        <th>Event Name</th>
                        <th>Type</th>
                        <th>Registrations</th>
                        <th>Status</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="worklistBody"></tbody>
            </table>
        </div>
    </div>

    <script src="js/app.js"></script>
    <script>
    // app.js-la irukkira API_URL-aiye idhuvum use pannum. 
    // Separate-ah const API_URL-nu inga declare pannaadheenga.

    async function loadWorklist() {
        const tbody = document.getElementById("worklistBody");
        if (!tbody) return;

        let backendEvents = [];
        
        // Direct URL-aiye use pannuvom confusion illama
        const fetchUrl = "https://tharika2004-event-project.hf.space/get-events";

        try {
            const response = await fetch(fetchUrl);
            if (!response.ok) throw new Error("Server error");
            const data = await response.json();
            backendEvents = Array.isArray(data) ? data : [];
        } catch (error) {
            console.warn("Backend fetch failed:", error);
        }

        // Local storage data
        const localEvents = JSON.parse(localStorage.getItem("myPostedEvents") || "[]");
        const allRegistrations = JSON.parse(localStorage.getItem("myRegisteredEvents") || "[]");

        // Merge backend + local
        const combinedEvents = [...backendEvents, ...localEvents];

        if (combinedEvents.length === 0) {
            tbody.innerHTML = `<tr><td colspan="5" style="text-align:center; padding: 50px;">No events found.</td></tr>`;
            return;
        }

        tbody.innerHTML = combinedEvents.map((ev) => {
            const title = ev.event_name || "Untitled";
            const college = ev.college_name || "Campus";
            const type = ev.event_type || "Event";
            
            // Registration count logic
            const count = allRegistrations.filter(reg => (reg.event_name === title)).length;
            
            return `
            <tr>
                <td><strong>${title}</strong><br><small style="color: var(--text-dim)">${college}</small></td>
                <td>${type}</td>
                <td><span class="reg-count">${count}</span> Students</td>
                <td><span class="status-badge status-live">Live</span></td>
                <td>
                    <div class="action-icons">
                        <i data-lucide="eye" onclick="viewRegisteredStudents('${title.replace(/'/g, "\\'")}', ${count})"></i>
                    </div>
                </td>
            </tr>`;
        }).join('');
        
        if (window.lucide) lucide.createIcons();
    }

    // Window object-la register pannuna dhaan HTML-la irundhu call aagum
    window.viewRegisteredStudents = function(title, count) {
        alert("Event: " + title + "\nTotal Registrations: " + count);
    };

    window.addEventListener('load', loadWorklist);
</script>        
</body>
</html>
