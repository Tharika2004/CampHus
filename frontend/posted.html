<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CampHus | My Posted Events</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <script>
    (function() {
        const theme = localStorage.getItem('theme');
        if (theme === 'dark') {
            document.documentElement.classList.add('dark-theme');
        }
    })();
</script>
    <style>
        :root { --bg-body: #F4F7FE; --text-main: #1B254B; --primary: #9333ea; --card-bg: #ffffff; --border: #E2E8F0; --text-dim: #A3AED0; }
        .dark-theme {
    --bg-body: #0f172a;
    --sidebar-bg: #111c44;
    --text-main: #ffffff;
    --card-bg: rgba(255, 255, 255, 0.1);
    --border: rgba(255, 255, 255, 0.1);
    --primary-light: rgba(147, 51, 234, 0.2);
    --pure-black: #ffffff;
}
        body { font-family: 'Poppins', sans-serif; background: var(--bg-body); color: var(--text-main); padding: 40px; margin: 0; transition: 0.3s ease; }
        .container { max-width: 1200px; margin: 0 auto; }
        .btn-back { text-decoration: none; color: var(--primary); font-weight: 600; display: inline-flex; align-items: center; gap: 8px; margin-bottom: 25px; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 25px; }
        .card { background: var(--card-bg); padding: 20px; border-radius: 25px; border: 1px solid var(--border); box-shadow: 0 10px 30px rgba(0,0,0,0.05); transition: 0.3s; }
        .event-img { width: 100%; height: 180px; object-fit: cover; border-radius: 20px; margin-bottom: 15px; }
        .btn-group { display: flex; gap: 12px; margin-top: 20px; }
        .edit-btn { background: var(--primary); color: white; border: none; padding: 12px; border-radius: 25px; cursor: pointer; flex: 1; font-weight: 600; }
        .delete-btn { background: #fee2e2; color: #ef4444; border: none; padding: 12px; border-radius: 25px; cursor: pointer; flex: 1; font-weight: 600; }
    </style>
</head>
<body>
    <div class="container">
        <a href="home.html" class="btn-back"><i data-lucide="arrow-left" size="18"></i> Back to Dashboard</a>
        <h2 style="margin-bottom: 30px; font-weight: 700;">Events You Have Posted</h2>
        <div id="myEventsGrid" class="grid"></div>
    </div>

    <script src="js/app.js"></script> 
    <script>
    function renderMyEvents() {
    const grid = document.getElementById("myEventsGrid");
    
    // 1. Current log-in panni irukkura user email-ai edukkurom
    const currentUserEmail = localStorage.getItem("userEmail");

    // 2. Local storage-la irundhu ellaa local events-aiyum edukkurom
    const allLocalEvents = JSON.parse(localStorage.getItem("myPostedEvents") || "[]");

    // 3. FILTER LOGIC: Logged-in user email-um, event-oda email-um match aaguradha mattum filter panrom
    // Note: Post pannumbodhu 'posted_by' field save panni irukanum
    const myEventsOnly = allLocalEvents.filter(ev => ev.posted_by === currentUserEmail);

    grid.innerHTML = "";

    if (myEventsOnly.length === 0) {
        grid.innerHTML = `
            <div style='grid-column: 1/-1; text-align: center; padding: 80px;'>
                <p style="color: var(--text-dim);">You haven't posted any events yet.</p>
                <a href="post.html" style="color: var(--primary); text-decoration: none; font-weight: 600;">Post an Event Now</a>
            </div>`;
        return;
    }

    // 4. Filter panna events-ai mattum display panrom
    grid.innerHTML = myEventsOnly.map((ev) => {
        // Original array-la indha event-oda index-ai kandupudikurom (Delete/Edit panna)
        const originalIndex = allLocalEvents.findIndex(item => item === ev);
        const img = ev.poster_image || 'https://picsum.photos/400/250';
        
        return `
            <div class="card">
                <img src="${img}" class="event-img" onerror="this.src='https://picsum.photos/400/250'">
                <h3 style="margin: 0 0 8px; font-weight: 600; color: var(--text-main);">${ev.event_name}</h3>
                <p style="color: var(--text-dim); font-size: 14px; margin: 0 0 5px 0;">
                    <i data-lucide="map-pin" size="14"></i> ${ev.venue}
                </p>
                <p style="color: var(--primary); font-size: 12px; font-weight: 600;">
                    <i data-lucide="calendar" size="14"></i> ${ev.event_date}
                </p>
                <div class="btn-group">
                    <button class="edit-btn" onclick="editEvent(${originalIndex})">
                        <i data-lucide="edit-3" size="16"></i> Edit
                    </button>
                    <button class="delete-btn" onclick="deleteEvent(${originalIndex})">
                        <i data-lucide="trash-2" size="16"></i> Delete
                    </button>
                </div>
            </div>
        `;
    }).join('');
    
    if (window.lucide) lucide.createIcons();
}

    // Function to handle Editing
    function editEvent(index) {
        // Save the index of the event we want to change
        localStorage.setItem("editIndex", index);
        // Redirect to post.html which will load the data for editing
        window.location.href = "post.html";
    }

    // Function to handle Deletion
    function deleteEvent(index) {
        if (confirm("Are you sure you want to delete this posted event?")) {
            // Get current list
            let myLocalEvents = JSON.parse(localStorage.getItem("myPostedEvents") || "[]");
            
            // Remove the item at the specific index
            myLocalEvents.splice(index, 1);
            
            // Save updated list back to Local Storage
            localStorage.setItem("myPostedEvents", JSON.stringify(myLocalEvents));
            
            // Refresh the display
            renderMyEvents();
        }
    }

    // Load events when the page opens
    window.onload = renderMyEvents;
</script>
</body>
</html>
