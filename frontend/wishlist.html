<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CampHus | My Wishlist</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <script>
    (function() {
        const theme = localStorage.getItem('theme');
        if (theme === 'dark') {
            document.documentElement.classList.add('dark-theme');
        }
    })();
</script>
    <style>
        :root { --bg-body: #F4F7FE; --text-main: #1B254B; --primary: #9333ea; --border: #E2E8F0; --card-bg: #ffffff; }
        .dark-theme {
    --bg-body: #0f172a;
    --sidebar-bg: #111c44;
    --text-main: #ffffff;
    --card-bg: rgba(255, 255, 255, 0.1);
    --border: rgba(255, 255, 255, 0.1);
    --primary-light: rgba(147, 51, 234, 0.2);
    --pure-black: #ffffff;
}
        body { font-family: 'Poppins', sans-serif; background: var(--bg-body); color: var(--text-main); padding: 40px; margin: 0; }
        .container { max-width: 1200px; margin: 0 auto; }
        .btn-back { text-decoration: none; color: var(--primary); font-weight: 600; display: flex; align-items: center; gap: 8px; margin-bottom: 30px; }
        .clear-all-btn { background: #fff1f1; color: #ff5e5e; border: 1px solid #ff5e5e; padding: 8px 16px; border-radius: 20px; cursor: pointer; font-weight: 600; display: flex; align-items: center; gap: 8px; transition: 0.3s; }
        .clear-all-btn:hover { background: #ff5e5e; color: white; }
        .events-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 25px; }
        .event-card { background: var(--card-bg); border-radius: 20px; padding: 15px; border: 1px solid var(--border); transition: 0.3s; }
        .event-card:hover { transform: translateY(-5px); box-shadow: 0 10px 20px rgba(0,0,0,0.05); }
        .img-wrapper { width: 100%; height: 180px; border-radius: 15px; overflow: hidden; margin-bottom: 15px; }
        .img-wrapper img { width: 100%; height: 100%; object-fit: cover; }
        .card-title { font-size: 18px; margin-bottom: 5px; font-weight: 600; }
        .card-loc { font-size: 13px; color: #A3AED0; display: flex; align-items: center; gap: 5px; }
        .remove-btn { width: 100%; padding: 10px; border-radius: 25px; margin-top: 10px; background: #fff1f1; color: #ff5e5e; border: 1px solid #ff5e5e; cursor: pointer; font-weight: 600; transition: 0.3s; }
        .remove-btn:hover { background: #ff5e5e; color: white; }
        .details-btn { width: 100%; padding: 10px; border-radius: 25px; background: #f3e8ff; color: #9333ea; border: 1px solid #9333ea; cursor: pointer; font-weight: 600; margin-top: 15px; transition: 0.3s; }
        .details-btn:hover { background: #9333ea; color: white; }
    </style>
</head>
<body>
    <div class="container">
        <a href="home.html" class="btn-back"><i data-lucide="arrow-left" size="18"></i> Back to Home</a>
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px;">
            <h1>My Wishlist 💜</h1>
            <button class="clear-all-btn" onclick="clearWishlist()">
                <i data-lucide="trash-2" size="16"></i> Clear All
            </button>
        </div>
        <div id="wishlistContainer" class="events-grid"></div>
    </div>

    <script src="js/app.js"></script>
    <script>
    window.onload = () => {
        renderWishlist();
    };

    function renderWishlist() {
        const container = document.getElementById("wishlistContainer");
        const savedItems = JSON.parse(localStorage.getItem("wishlist") || "[]");
        container.innerHTML = "";

        if (savedItems.length === 0) {
            container.innerHTML = `
                <div style="text-align:center; grid-column:1/-1; padding:50px;">
                    <p style="color: #A3AED0; font-size: 18px;">Your wishlist is empty. ✨</p>
                    <a href="home.html" style="color: var(--primary); text-decoration: none; font-weight: 600;">Go Explore Events</a>
                </div>`;
            return;
        }

        savedItems.forEach((e, index) => {
            const title = e.event_name || "Untitled Event";
            const college = e.college_name || "Campus";
            
            // Image Logic
            let poster = e.poster_image;
            if (!poster) {
                poster = `https://picsum.photos/400/250?random=${e.id || index}`;
            } else if (!poster.startsWith('http')) {
                poster = `https://tharika2004-event-project.hf.space/file=${poster.replace(/\\/g, '/')}`;
            }

            container.innerHTML += `
            <div class="event-card">
              <div class="img-wrapper">
                <img src="${poster}" onerror="this.src='https://picsum.photos/400/250'">
              </div>
              <div class="card-body">
                <h3 class="card-title" style="font-size: 16px; color: #1B254B; margin-bottom: 8px;">${title}</h3>
                <div class="card-loc" style="font-size: 13px; color: #A3AED0; margin-bottom: 15px;">
                    <i data-lucide="map-pin" size="14"></i> ${college}
                </div>
                
                <button class="details-btn" onclick="window.location.href='event.html?id=${e.id}'">
                    View Details
                </button>

                <button class="remove-btn" onclick="removeFromWishlist(${index})">
                    <i data-lucide="trash-2" size="14" style="vertical-align: middle;"></i> Remove
                </button>
              </div>
            </div>`;
        });
        
        if (window.lucide) lucide.createIcons();
    }

    function removeFromWishlist(index) {
        let currentWishlist = JSON.parse(localStorage.getItem("wishlist") || "[]");
        currentWishlist.splice(index, 1);
        localStorage.setItem("wishlist", JSON.stringify(currentWishlist));
        renderWishlist(); 
    }

    function clearWishlist() {
        if (confirm("Are you sure you want to clear your entire wishlist?")) {
            localStorage.setItem("wishlist", JSON.stringify([]));
            renderWishlist();
            alert("Wishlist cleared! ✨");
        }
    }
</script>
</body>
</html>
